name: CI

# Tags run CI through the release workflow instead.
on:
  push:
    branches: ["**"]
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pycairo and manimpango ship no Linux wheels, so they build from source.
      # Windows needs nothing: every dependency has a wheel there.
      - name: Install cairo and pango headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags since v8

      - name: Install
        run: uv sync --locked

      # Ubuntu 24.04 restricts user namespaces, so Codex's sandbox can't start until bubblewrap
      # gets ManimFlow's AppArmor profile. Ubuntu 26.04 ships its own profile for bubblewrap,
      # and adding ManimFlow's there breaks the sandbox's network namespace. So, as the doctor
      # check and the chat tell teachers, the command runs only when the sandbox doesn't start.
      # bubblewrap is installed first only so apt doesn't stop to ask.
      - name: Let the agent sandbox start
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          problem="$(uv run python -c 'import os; from manimflow.linux_sandbox import problem; print(problem(os.environ["PATH"]) or "")')"
          if [ -n "$problem" ]; then
            echo "$problem"
            eval "$(uv run python -c 'from manimflow.linux_sandbox import fix_command; print(fix_command())')"
          fi

      # The bundled example writes Tex and MathTex, so CI needs LaTeX: the TinyTeX that
      # `doctor` installs for teachers, in the runner's user folder. It ends with check mode
      # and fails if anything is still missing. The tests then render with it, and check
      # that a second install changes nothing.
      - name: Install LaTeX
        run: uv run manimflow doctor --install

      - name: Typecheck
        run: uv run mypy

      # The fixture lesson renders at low quality, and exports at 144p, except for a
      # few final-quality tests.
      - name: Test
        run: uv run pytest

  package:
    uses: ./.github/workflows/package.yml
