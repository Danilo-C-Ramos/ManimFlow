name: CI

on: push

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pycairo and manimpango ship no Linux wheels, so they build from source.
      # Windows needs nothing: every dependency has a wheel there.
      - name: Install cairo and pango headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      # The bundled example writes Tex and MathTex, so CI needs LaTeX. TinyTeX plus
      # Manim's documented package list is also what `doctor` will install for teachers.
      - uses: r-lib/actions/setup-tinytex@v2.14.0

      - name: Install Manim's LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install standalone preview doublestroke setspace rsfs relsize ragged2e fundus-calligra microtype wasysym physics dvisvgm jknapltx wasy cm-super babel-english gnu-freefont mathastext cbfonts-fd

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags since v8

      - name: Install
        run: uv sync --locked

      - name: Typecheck
        run: uv run mypy

      # The fixture lesson renders at low quality except for one final-quality test.
      - name: Test
        run: uv run pytest
