name: Release

# Pushing a tag such as `v0.0.2` publishes ManimFlow 0.0.2 to PyPI, once the tests pass
# and the package runs on a clean Windows runner.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # PyPI trusts this repository, workflow and environment, so no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/manimflow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check that the version is the tag's
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/manimflow-${version}-py3-none-any.whl"
          test -f "dist/manimflow-${version}.tar.gz"

      - uses: pypa/gh-action-pypi-publish@release/v1
