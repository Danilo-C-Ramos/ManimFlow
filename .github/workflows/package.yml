name: Package

# Builds the package and runs it on a clean Windows runner the way a teacher would: from
# the wheel, and from a ZIP of the repository, as the README says.
# CI calls this on every push and the release workflow publishes what it builds.
on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the latest tag

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags since v8

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # What GitHub's "Download ZIP" gives: the files without git.
      - name: Zip the source
        run: git archive --format=zip --prefix=ManimFlow-main/ -o ManimFlow-main.zip HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: ManimFlow-main.zip

  # No checkout and no `uv sync`: only uv and the built wheel, as on a teacher's computer.
  try-on-windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: uvx manimflow --help
        run: uvx --from dist/*.whl manimflow --help

      # A clean runner may lack LaTeX, so this check can fail, but it must still report.
      - name: uvx manimflow doctor, before installing LaTeX
        run: |
          uvx --from dist/*.whl manimflow doctor --json > before.json || true
          cat before.json
          python -c "import json; r = json.load(open('before.json', encoding='utf-8')); assert r['command'] == 'doctor' and r['checks'], r"

      - name: uvx manimflow doctor --install
        run: uvx --from dist/*.whl manimflow doctor --install

      - name: uvx manimflow doctor
        run: uvx --from dist/*.whl manimflow doctor

  # The README's way: uv from its installer, then `uv run` in the repository's ZIP, unzipped
  # into a folder with spaces and accents. Then the app itself runs, in Edge.
  try-from-source-on-windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Unzip into Downloads\Aulas de Física
        run: |
          $folder = Join-Path $HOME "Downloads\Aulas de Física"
          Expand-Archive ManimFlow-main.zip -DestinationPath $folder
          "MANIMFLOW=$(Join-Path $folder 'ManimFlow-main')" >> $env:GITHUB_ENV

      - name: Install uv
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$HOME\.local\bin" >> $env:GITHUB_PATH

      - name: uv run manimflow doctor --install
        working-directory: ${{ env.MANIMFLOW }}
        run: uv run manimflow doctor --install

      - name: uv run manimflow doctor
        working-directory: ${{ env.MANIMFLOW }}
        run: uv run manimflow doctor

      # Renders the example's previews, talks to the demo agent, and opens Codex's sign-in.
      - name: Go through the app in Edge
        working-directory: ${{ env.MANIMFLOW }}
        run: uv run --no-project --with playwright==1.64.1 python .github/try_the_app.py "$env:RUNNER_TEMP\telas" uv run manimflow

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: telas-windows
          path: ${{ runner.temp }}/telas
