[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "manimflow"
dynamic = ["version"]
description = "Chat-driven Manim animation studio for teachers"
readme = "README.md"
license = "MIT"
# Pinned to one minor version: every dependency (manim, pycairo, manimpango,
# av, nicegui, openai-codex-cli-bin, pygit2) ships Windows wheels for 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim>=0.22,<0.23",
    "nicegui>=3,<4",
    "openai-codex>=0.162,<0.163",
    "pygit2>=1.18,<2",
    # The agent runs each lesson's test_fisica.py with it.
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "ruamel.yaml>=0.19,<0.20",
]

[project.scripts]
manimflow = "manimflow.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest-asyncio>=1",
    "types-pyyaml>=6",
]

# The version comes from the git tag: `v0.0.2` builds 0.0.2. Any other commit builds a
# version with a local part, such as 0.0.3.dev1+g1a2b3c4, which PyPI refuses. A copy
# without git, such as GitHub's "Download ZIP", builds 0.0.0.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the installed package's metadata when the commit or tag changes its version.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/manimflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The smoke test drives the real Codex agent with a signed-in account, so it
# only runs on request: `uv run pytest -m smoke`.
addopts = ["-m", "not smoke"]
markers = ["smoke: drives the real Codex agent; needs a signed-in account and spends quota"]

[tool.mypy]
files = ["src", "tests"]
# Lesson code belongs to the teacher and is checked by rendering it, not by mypy.
exclude = ["src/manimflow/exemplos/", "src/manimflow/modelo/"]
ignore_missing_imports = true
