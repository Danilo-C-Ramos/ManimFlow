<!doctype html>
<!--
  PROTOTYPE — throwaway. Round 2. Switch with ?variant=F|C, the pink bar (bottom right) or ← →.
    F · Final      — merges round 1 as agreed: B's studio lesson screen and B's course page,
                     A's ChatGPT home and inline chat cards. The preview resizes with the
                     mouse (drag the bar between chat and preview) and closes entirely (✕).
    C · Colorido   — the same base, with more color and more ideas from the Mobbin
                     references: a sidebar of courses, lessons, status and quick actions instead
                     of a chat history; comments pinned on the image; a proportional timeline;
                     a command palette; suggestion chips; approve-in-composer.
  Round 1 (A and B) is kept in v1-a-b.html. Open the file in a browser; nothing persists.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManimFlow · protótipo 2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
<style>
:root{
  --bg:#ffffff; --side:#f9f9f9; --hover:#ececec; --active:#e3e3e3; --line:#e5e5e5;
  --text:#0d0d0d; --muted:#6b6b6b; --faint:#9b9b9b; --bubble:#f1f1f1; --card:#fff;
  --accent:#0d0d0d; --accent-text:#fff; --accent-soft:#ececec;
  --blue:#2563eb; --green:#16a34a; --orange:#d9480f; --red:#dc2626; --amber:#d97706; --teal:#0d9488;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
/* Variant C: a colored accent and tinted surfaces */
body.c{ --accent:#1d64d8; --accent-text:#fff; --accent-soft:#e7effc; --side:#f6f8fb; --hover:#eaeff6; --active:#dce7f9; --bubble:#e7effc; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing svg{pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--bg)}
.app{display:flex;height:100vh}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;align-items:center;gap:8px} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Sidebar ───────────────────────────────────────────────── */
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px;gap:2px}
.side .top{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px}
body.c .logo{background:var(--accent)}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;width:100%;text-align:left;white-space:nowrap;overflow:hidden;position:relative}
.nav:hover{background:var(--hover)} .nav.on{background:var(--active)}
.nav .ic{width:18px;text-align:center;flex:none;opacity:.85}
.sec{font-size:12px;color:var(--faint);padding:14px 10px 4px;display:flex;align-items:center;gap:6px}
.sub .nav{padding-left:38px;font-size:13.5px}
.sidescroll{flex:1;overflow:auto;margin:0 -8px;padding:0 8px}
.usage{margin:6px 4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:12px;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}
body.c .bar i{background:var(--accent)}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.me:hover{background:var(--hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:#d6e4f0;color:#1f4f7a;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

/* sidebar C: courses tree with status and quick actions */
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-weight:600}
.newbtn:hover{filter:brightness(1.08)}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);margin-top:6px}
.searchbtn:hover{border-color:#c4d5ef}
.count{font-size:11px;border-radius:999px;padding:0 7px;background:var(--hover);color:var(--muted)}
.count.hot{background:#fff1d6;color:#a35400}
.inbox{display:flex;gap:10px;padding:7px 10px;border-radius:8px;width:100%;text-align:left;align-items:flex-start}
.inbox:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.tsq{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none;font-weight:600}
.trow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;width:100%;cursor:pointer;position:relative}
.trow:hover{background:var(--hover)} .trow.on{background:var(--active)}
.chev{width:16px;color:var(--faint);font-size:10px;text-align:center;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.lrowS{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 34px;border-radius:8px;width:100%;cursor:pointer;font-size:13.5px;position:relative}
.lrowS:hover{background:var(--hover)} .lrowS.on{background:var(--active)}
.qa{display:none;gap:2px;position:absolute;right:4px;top:50%;transform:translateY(-50%);background:inherit;padding-left:6px}
.trow:hover .qa,.lrowS:hover .qa{display:flex}
.qa button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.qa button:hover{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.trow:hover .hide-on-hover,.lrowS:hover .hide-on-hover{visibility:hidden}

/* ── Main area ─────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid transparent}
.topbar.lined{border-bottom-color:var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:15px;padding:6px 8px;border-radius:8px}
.crumb:hover{background:var(--hover)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.content{flex:1;display:flex;min-height:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}

/* ── Composer ──────────────────────────────────────────────── */
.composer{border:1px solid var(--line);border-radius:24px;background:var(--bg);box-shadow:var(--shadow);padding:10px 10px 8px 16px}
body.c .composer:focus-within{border-color:#a9c4ef;box-shadow:0 0 0 4px #e7effc}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;min-height:24px;max-height:160px;padding:4px 0}
.composer .tools{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:var(--bg);white-space:nowrap}
.chip:hover{background:var(--hover)} .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
body:not(.c) .chip.on{background:#e8f0f8;color:#174a77}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-size:16px;flex:none}
.attach{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 6px}
.attach .chip{background:#fff6e0;border-color:#f6dfa6;color:#7a4b00}
.approvebar{display:flex;align-items:center;gap:8px;margin:-2px -2px 8px -8px;padding:8px 8px 8px 12px;border-radius:14px;background:#fff7e6;color:#7a4b00;font-size:13px}
.suggest{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.suggest .chip{color:var(--muted)}
body.c .suggest .chip:nth-child(4n+1){background:#e7effc;color:#1d64d8;border-color:transparent}
body.c .suggest .chip:nth-child(4n+2){background:#e9f7ef;color:#137a3a;border-color:transparent}
body.c .suggest .chip:nth-child(4n+3){background:#fff2e8;color:#b4400a;border-color:transparent}
body.c .suggest .chip:nth-child(4n+4){background:#e0f4f2;color:#0b7a70;border-color:transparent}

/* ── Chat ──────────────────────────────────────────────────── */
.thread{flex:1;overflow:auto}
.thread-inner{margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.msg-user{align-self:flex-end;max-width:85%;background:var(--bubble);padding:9px 14px;border-radius:18px;white-space:pre-wrap}
.msg-agent{display:flex;flex-direction:column;gap:10px}
.msg-agent p{margin:0}
.actions{display:flex;gap:2px;color:var(--muted);align-items:center;font-size:12.5px} .actions button{padding:3px 7px;border-radius:6px} .actions button:hover{background:var(--hover)}
.checkpoint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.checkpoint::before,.checkpoint::after{content:"";flex:1;border-top:1px dashed var(--line)}
.activity{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.activity summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.activity summary::-webkit-details-marker{display:none}
.activity summary:hover{background:var(--side)}
.activity ol{list-style:none;margin:0;padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.activity li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.activity li .cmd{color:var(--faint);font-size:11px}
.ok{color:var(--green)} .bad{color:var(--red)} .run{color:var(--blue)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #c7d7f5;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.plan{border:1px solid var(--line);border-radius:16px;background:var(--side);padding:12px 14px}
.plan h4{margin:0 0 8px;font-size:13.5px;font-weight:600}
.plan .st{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.plan .st:first-of-type{border-top:0}
.tag{font:600 11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;text-align:center;white-space:nowrap}
.trans{font-size:12px;color:var(--muted);padding-left:50px;margin:-2px 0 2px}
.comment{font-size:12px;color:#8a5a00;background:#fff6e0;border-radius:8px;padding:3px 8px;margin-top:4px;display:inline-block}
.result{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card)}
.result:hover{box-shadow:var(--shadow)}
.result .strip{display:flex;gap:6px;padding:8px;background:var(--side);overflow:hidden}
.result .strip svg{width:96px;flex:none;border-radius:6px;border:1px solid var(--line)}
.result .foot{display:flex;align-items:center;gap:10px;padding:9px 12px}

/* ── Resizable split ───────────────────────────────────────── */
.chatcol{flex:none;display:flex;flex-direction:column;min-height:0;min-width:0}
.chatcol.full{flex:1}
.chatcol.full .thread-inner,.chatcol.full .composer-wrap{max-width:740px;width:100%;margin:0 auto}
.resizer{width:9px;flex:none;cursor:col-resize;position:relative;margin:0 -4px;z-index:5}
.resizer::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line)}
.resizer::after{content:"";position:absolute;left:2px;top:50%;width:5px;height:40px;margin-top:-20px;border-radius:3px;background:#cfcfcf;opacity:0;transition:opacity .15s}
.resizer:hover::before,body.resizing .resizer::before{background:var(--accent);width:2px;left:3.5px}
.resizer:hover::after,body.resizing .resizer::after{opacity:1;background:var(--accent)}
.ws{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;background:var(--bg)}

/* ── Workspace ─────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.tab{padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.tab:hover{background:var(--hover)} .tab.on{background:var(--active);color:var(--text)}
body.c .tab.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pbody{flex:1;overflow:auto;min-height:0}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:min(100%, calc((100vh - 330px) * 1.7778));margin:0 auto}
.stage svg{width:100%;height:100%;display:block}
.stage.pinning{cursor:crosshair;box-shadow:0 0 0 3px #f6c453}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -2px;border-radius:13px 13px 13px 2px;background:#f59f00;color:#fff;font:600 12px/26px sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
.pin.done{background:var(--green)}
.pinbox{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;width:240px;z-index:3}
.pinbox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:0}
.overlay{position:absolute;inset:0;background:#f6f8fb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.overlay .lines div{font-size:13px;color:var(--faint);text-align:center;transition:all .3s}
.overlay .lines div.now{color:var(--text);font-weight:500}
.player{display:flex;align-items:center;gap:10px;padding:8px 2px;max-width:100%;margin:0 auto}
.scrub{flex:1;height:4px;border-radius:2px;background:var(--hover);position:relative}
.scrub i{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:2px}
.film{display:flex;align-items:center;overflow-x:auto;padding:10px 16px 14px}
.frame{flex:none;width:140px;border-radius:10px;border:2px solid transparent;padding:3px;cursor:pointer}
.frame:hover{background:var(--side)} .frame.on{border-color:var(--blue)}
.frame svg{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
.frame .cap{font-size:12px;padding:4px 2px 0;display:flex;gap:6px}
.tpill{flex:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:0 4px;margin-top:-18px;cursor:pointer}
.tpill b{width:30px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--text);background:var(--bg)}
.tpill:hover b{background:var(--accent);color:var(--accent-text)}
.tpill.on b{background:var(--blue);color:#fff;border-color:var(--blue)}

/* C: vertical states rail + proportional timeline */
.pv{display:flex;height:100%}
.rail{width:150px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--side)}
@container (max-width:620px){ .rail{display:none} }
.rstate{display:block;width:100%;border-radius:10px;padding:5px;border:2px solid transparent;text-align:left}
.rstate:hover{background:var(--hover)} .rstate.on{border-color:var(--accent);background:var(--bg)}
.rstate svg{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
.rstate .cap{display:flex;gap:6px;font-size:11.5px;padding-top:3px;align-items:center}
.rtrans{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:2px 10px;margin:0 auto;border-radius:999px}
.rtrans:hover{background:var(--accent-soft);color:var(--accent)}
.stagecol{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 18px;gap:8px;overflow:auto}
.track{display:flex;gap:3px;align-items:stretch;height:46px;margin-top:4px}
.blk{border-radius:8px;font-size:11px;padding:4px 6px;overflow:hidden;white-space:nowrap;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0}
.blk span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis}
.blk .fill{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.12)}
.blk.cut{background:var(--side);border:1px dashed var(--line);color:var(--faint);cursor:default}
.ruler{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace}

/* code / equations / plan board */
.code{display:flex;height:100%}
.files{width:170px;flex:none;border-right:1px solid var(--line);padding:8px;font-size:13px}
.file{display:flex;gap:8px;padding:5px 8px;border-radius:6px;width:100%;text-align:left}
.file:hover{background:var(--hover)} .file.on{background:var(--active)}
.editor{flex:1;min-width:0;display:flex;flex-direction:column}
.editor pre{margin:0;flex:1;overflow:auto;padding:14px 16px;font-size:12.5px;line-height:1.6;outline:none}
.editor pre code.hljs{background:none;padding:0}
.edbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.eq{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.eq .name{font-size:12px;color:var(--muted);grid-column:1/-1}
.eq .val{font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.eqh{font-size:12px;color:var(--faint);padding:14px 16px 4px;text-transform:uppercase;letter-spacing:.04em}
.cards{display:flex;align-items:stretch;overflow-x:auto;padding:16px}
.pcard{flex:none;width:210px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.pcard svg{width:100%;border-radius:6px;border:1px solid var(--line)}
.pcard textarea{border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;resize:none;font-size:13px;color:var(--muted);min-height:96px;background:none}
.pcard textarea:hover,.pcard textarea:focus{border-color:var(--line);outline:0;background:var(--side)}
.parrow{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted)}

/* ── Pages ─────────────────────────────────────────────────── */
.center{flex:1;overflow:auto}
.ptitle{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:500}
.picon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);position:relative}
.gcard:hover{box-shadow:var(--shadow)}
.gcard svg,.gcard .ph{width:100%;display:block;border-bottom:1px solid var(--line);aspect-ratio:16/9}
.gcard .b{padding:10px 12px}
.gcard .hover{position:absolute;top:8px;right:8px;display:none;gap:4px}
.gcard:hover .hover{display:flex}
.gcard .hover button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;box-shadow:var(--shadow)}
.gcard .hover button:hover{background:var(--hover)}
.newcard{border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;min-height:180px;color:var(--muted);cursor:pointer}
.newcard:hover{background:var(--side);border-color:var(--accent);color:var(--accent)}
.instr{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--bg)}
.instr h5{margin:0 0 4px;font-size:13.5px}

/* ── Modal / menu / palette ────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.35);display:grid;place-items:center;z-index:50}
.scrim.top{place-items:start center;padding-top:12vh}

.field{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:0;background:var(--bg)}
.hint{display:flex;gap:10px;background:var(--side);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:12px;color:var(--muted)}

.setting{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:8px;font-size:12.5px}

.settings{display:flex;min-height:420px}
.settings nav{width:180px;border-right:1px solid var(--line);padding:12px 8px}
.settings section{flex:1;padding:16px 22px}
.settings h3{margin:0 0 14px;font-size:17px;font-weight:600}
.menu{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:220px}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px}

//  Fake Manim render: a Minkowski diagram drawn in SVG
// ═════════════════════════════════════════════════════════════
const C = {ink:'#1a1a1a', blue:'#1f6fb2', orange:'#d9480f', dorange:'#9a3412', gold:'#b8860b', green:'#2b8a3e', grid:'#e8e8e8'};
function diagram(id, p=1, opts={}){
  const idx = id==='S3v' ? ORDER.indexOf('S3') : ORDER.indexOf(id);
  const at = s => idx >= ORDER.indexOf(s);
  const only = s => id===s;
  const boost = id==='R' ? 0.6*ease(p) : 0;
  const g = 1/Math.sqrt(1-boost*boost);
  const T = (x,t) => boost ? [g*(x-boost*t), g*(t-boost*x)] : [x,t];
  const X = x => 230 + x*30, Y = t => 335 - t*28;
  const P = (x,t) => { const [a,b]=T(x,t); return [X(a),Y(b)]; };
  const fresh = s => id===s && !opts.still ? ease(p) : 1;      // reveal factor for the state just entered
  let o = '';
  const line = (x1,t1,x2,t2,col,w=2,f=1,dash='') => { const [a,b]=P(x1,t1), [c,d]=P(x1+(x2-x1)*f, t1+(t2-t1)*f);
    o += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round"/>`; };
  const dot = (x,t,col,r=5,f=1) => { if(f<.05) return; const [a,b]=P(x,t); o += `<circle cx="${a}" cy="${b}" r="${r*f}" fill="${col}"/>`; };
  const txt = (x,t,s,col,dx=8,dy=-8,f=1,size=15) => { if(f<.3) return; const [a,b]=P(x,t); o += `<text x="${a+dx}" y="${b+dy}" fill="${col}" font-size="${size}" font-family="Georgia,serif" opacity="${f}">${s}</text>`; };
  // grid
  for(let i=-8;i<=16;i++){ o+=`<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="360" stroke="${C.grid}" stroke-width="1"/>`; }
  for(let i=-2;i<=14;i++){ o+=`<line x1="0" y1="${Y(i)}" x2="640" y2="${Y(i)}" stroke="${C.grid}" stroke-width="1"/>`; }
  // Earth axes + Earth worldline + hero
  line(-1,0,11,0,C.blue,2); line(0,-1,0,11.5,C.blue,2);
  txt(11,0,'x<tspan font-size="11">T</tspan>',C.blue,4,18); txt(0,11.5,'ct<tspan font-size="11">T</tspan>',C.blue,-34,10);
  line(8,-1,8,11.5,C.blue,3); txt(8,11,'Terra',C.blue,8,10,1,13);
  // hero axes
  if(at('S1')){ const v = id==='S1' && !opts.still ? 0.6*ease(p) : 0.6;
    line(0,0,11*v,11,C.orange,2); line(0,0,11,11*v,C.orange,2);
    txt(11*v,11,'ct<tspan font-size="11">H</tspan>',C.orange,6,6); txt(11,11*v,'x<tspan font-size="11">H</tspan>',C.orange,4,18); }
  // reflection
  if(at('S2')){ const f = fresh('S2');
    line(0,0,8,8,C.gold,4,f); line(0,0,4.8,8,C.dorange,3,f);
    dot(0,0,C.ink,5); dot(8,8,C.ink,5,f>.98?1:0); txt(8,8,'(8, 8)',C.blue,10,4,f>.98?1:0); }
  if(only('S2b')){ const f = fresh('S2b');
    line(8,8,4.8,8,C.green,2.5,f,'6 5'); line(4.8,8,4.8,0,C.green,2.5,f,'6 5'); dot(4.8,8,C.green,5,f);
    txt(4.8,8,'6,4',C.green,-30,-8,f); txt(4.8,0,'4,8',C.green,-12,20,f); }
  if(at('S2c') && id!=='R'){ const f = fresh('S2c');
    line(8,8,3,5,C.orange,2,f,'6 5'); line(8,8,5,3,C.orange,2,f,'6 5'); txt(8,8,'(4, 4)',C.orange,10,24,f); }
  if(at('S3')){ const f = id==='S3' ? fresh('S3') : 1;
    line(8,8,6,10,C.gold,4,f); line(4.8,8,6,10,C.dorange,3,f); dot(6,10,C.ink,5,f>.98?1:0);
    txt(6,10,'Colisão',C.ink,-70,-8,f>.98?1:0,14); if(!boost) txt(6,10,'(6, 10)',C.blue,10,4,f>.98?1:0); }
  if(only('S5')){ const f = fresh('S5'); line(0,0,8,4.8,C.green,3,f); txt(8,4.8,'t<tspan font-size="11">T</tspan> = 4,8',C.green,8,4,f); }
  if(id==='R' && p>.9){ txt(0,8,'(0, 8)',C.orange,10,4); txt(4,4,'(4, 4)',C.green,10,4); }
  return `<svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#fff"/>${o}</svg>`;
}
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function composer(placeholder, opts={}){
  const l = lesson();
  const approve = isC() && S.view==='lesson' && S.lesson==='a10' && !S.planApproved.a10;
  const pend = isC() && S.pending.length ? `<div class="attach">${S.pending.map((p,i)=>`<span class="chip">📍 ${p.state} · ${p.text} <button onclick="S.pending.splice(${i},1);S.pins=S.pins.filter(x=>x!==S.pending[${i}]);render()">✕</button></span>`).join('')}</div>` : '';
  return `${opts.suggest && isC() && !approve ? `<div class="suggest">${['🐢 Mais devagar','🔠 Rótulos maiores','🎨 Trocar as cores','＋ Mais um estado','⬛ Fundo preto para projetor'].map(s=>`<button class="chip" onclick="send('${s.slice(2).trim()}')">${s}</button>`).join('')}</div>`:''}
  <div class="composer">
    ${approve?`<div class="approvebar">⏳ <span class="grow">O plano está esperando você.</span><button class="btn sm" onclick="go({wsTab:'plan',ws:true})">Ver plano</button><button class="btn sm primary" onclick="approve()">Aprovar plano</button></div>`:''}
    ${pend}
    <textarea rows="${opts.big?2:1}" placeholder="${placeholder}" id="msg" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <div class="tools">
      <button class="iconbtn" title="Anexar imagem ou PDF">＋</button>
      ${opts.turma? turmaPicker():''}
      <button class="chip ${S.mode==='rapido'?'on':''}" onclick="go({mode:'rapido'})">⚡ Rápido</button>
      <button class="chip ${S.mode==='capricho'?'on':''}" onclick="go({mode:'capricho'})">✦ Caprichado</button>
      <span class="grow"></span>
      <button class="send" onclick="send()">↑</button>
    </div></div>`;
}
function turmaPicker(){ const p=proj(); return `<button class="chip" style="background:${p.bg};color:${p.fg};border-color:transparent" onclick="pickTurma(event)">${p.icon} ${p.name} ▾</button>`; }

function startResize(e){
  e.preventDefault();
  const split = document.getElementById('split'), col = document.getElementById('chatcol');
  const left = split.getBoundingClientRect().left, max = split.getBoundingClientRect().width - 380;
  document.body.classList.add('resizing');
  const move = ev => { S.chatW = Math.max(300, Math.min(max, ev.clientX - left)); col.style.width = S.chatW+'px'; };
  const up = () => { removeEventListener('pointermove',move); removeEventListener('pointerup',up); document.body.classList.remove('resizing'); render(); };
  addEventListener('pointermove',move); addEventListener('pointerup',up);
}

    perfil:`<h3>Perfil do professor</h3><div class="setting"><div class="grow"><b>Fundo</b></div><div class="seg"><button class="on">Branco</button><button>Preto</button></div></div><div class="setting"><div class="grow"><b>Paleta</b></div><div class="row">${Object.values(C).slice(0,6).map(c=>`<span style="width:20px;height:20px;border-radius:6px;background:${c}"></span>`).join('')}</div></div><div class="setting"><div class="grow"><b>Separador decimal</b></div><div class="seg"><button class="on">vírgula</button><button>ponto</button></div></div>`,
    pasta:`<h3>Pasta das aulas</h3><input class="field mono" value="C:\\Users\\prof\\Documents\\Aulas Manim"><button class="btn sm" style="margin-top:10px">Trocar pasta…</button>`,
  };
  modal(`<div class="mhead">Configurações${X_}</div><div class="settings"><nav>${navs.map(([k,l])=>`<button class="nav ${k===tab?'on':''}" onclick="openSettings('${k}')">${l}</button>`).join('')}</nav><section>${sec[tab]}</section></div>`, true);
}
function openSearch(){
  const all = PROJECTS.flatMap(p=>p.lessons.map(l=>({...l,p})));
  modal(`<div class="mbody" style="padding-top:16px"><input class="field" placeholder="Buscar aulas…" autofocus>${all.map(l=>`<button class="nav" onclick="closeModal();openLesson('${l.p.id}','${l.id}')"><span class="ic" style="color:${l.p.fg}">${l.p.icon}</span><span class="grow ellipsis">${l.name}</span><span class="faint small">${l.when}</span></button>`).join('')}</div>`, false, true);
}
// C: Ctrl+K palette — lessons and actions in one place
function openPalette(){
  const l = S.view==='lesson' ? lesson() : null;
  const actions = [
    ['＋','Nova aula em '+proj().name, `closeModal();newLessonIn('${S.project}')`],
    l && ['⇩','Exportar '+l.short+' para PowerPoint', `closeModal();openExport()`],
    l && ['▶','Renderizar a prévia de novo', `closeModal();send('Renderize a prévia de novo')`],
    l && ['📁','Abrir a pasta da aula', 'closeModal()'],
    ['✎','Editar as instruções de '+proj().name, `closeModal();go({view:'project',projTab:'instr'})`],
    ['★','Abrir o exemplo de relatividade', `closeModal();openLesson('rel','ex')`],
    ['⚙','Configurações', `openSettings('conta')`],
  ].filter(Boolean);
  const lessons = PROJECTS.flatMap(p=>p.lessons.map(x=>({...x,p})));
  modal(`<div class="palette" style="padding:10px"><input class="field" placeholder="Buscar aula, turma ou ação…" autofocus style="font-size:15px;padding:11px 14px">
    <div class="grp">Ações</div>${actions.map(([i,t,on],k)=>`<button class="item ${k===0?'on':''}" onclick="${on}"><span class="tsq" style="background:var(--accent-soft);color:var(--accent)">${i}</span>${t}</button>`).join('')}
    <div class="grp">Aulas</div>${lessons.map(x=>`<button class="item" onclick="closeModal();openLesson('${x.p.id}','${x.id}')"><span class="tsq" style="background:${x.p.bg};color:${x.p.fg}">${x.p.icon}</span><span class="grow ellipsis">${x.name}</span><span class="pill" style="background:${STATUS[x.status].bg};color:${STATUS[x.status].c}">${STATUS[x.status].t}</span></button>`).join('')}
    <div class="row faint small" style="padding:10px 12px 4px"><kbd>↑</kbd><kbd>↓</kbd> navegar <kbd>Enter</kbd> abrir <kbd>Esc</kbd> fechar</div></div>`, false, true);
}
function openThreads(){
  modal(`<div class="mhead">Conversas desta aula${X_}</div><div class="mbody"><div class="muted small">Cada sessão começa uma conversa nova. O que foi decidido fica no CONTEXTO.md, então o agente não esquece.</div>
    ${[['Hoje','Eixos do herói mais devagar'],['12/11','Plano e primeira prévia'],['10/11','Ideias iniciais']].map(([d,t],i)=>`<button class="nav ${i===0?'on':''}"><span class="grow">${t}</span><span class="faint small">${d}</span></button>`).join('')}</div>`);
}
function openVersions(){
  modal(`<div class="mhead">Versões${X_}</div><div class="mbody">${[['agora','Eixos do herói mais devagar','agente'],['há 1 h','Edição manual em cenas.py','você'],['ontem','Primeira prévia','agente'],['12/11','Plano aprovado','agente']].map(([d,t,w])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${t}</b><div class="faint small">${d} · ${w}</div></div><button class="btn sm">Ver</button><button class="btn sm">Voltar para esta</button></div>`).join('')}</div>`);
}
function popMenu(e, html){
  closeMenu(); const r = e.currentTarget.getBoundingClientRect();
  const m = document.createElement('div'); m.className='menu'; m.id='menu';
  m.style.left = Math.min(r.left, innerWidth-240)+'px'; m.style.top = (r.bottom+6)+'px'; m.innerHTML = html;
  document.body.appendChild(m); setTimeout(()=>addEventListener('click',closeMenu,{once:true}));
}
function closeMenu(){ document.getElementById('menu')?.remove(); }
function lessonMenu(e){ popMenu(e, `<button onclick="openThreads()">🕘 Conversas anteriores</button><button onclick="openVersions()">↺ Versões</button><button>📁 Abrir pasta da aula</button><button>✎ Renomear</button><button>⇄ Mover para outra turma</button><button>⧉ Duplicar como modelo</button><button style="color:var(--red)">🗑 Apagar</button>`); }
function turmaMenu(e,id){ popMenu(e, `<button onclick="newLessonIn('${id}')">＋ Nova aula</button><button>✎ Renomear turma</button><button>🎨 Mudar cor</button><button>📁 Abrir pasta</button><button>🗄 Arquivar semestre</button>`); }
function pickTurma(e){ e.stopPropagation(); popMenu(e, PROJECTS.map(p=>`<button onclick="go({project:'${p.id}'})"><span style="color:${p.fg}">${p.icon}</span>${p.name}</button>`).join('') + `<button onclick="openNewProject()">＋ Nova turma</button>`); }

// ═════════════════════════════════════════════════════════════
//  Fake behaviour
// ═════════════════════════════════════════════════════════════
function openLesson(p,l){ go({view:'lesson',project:p,lesson:l,extra:[],state:'S3',playing:null,draft:null,pinMode:false, wsTab: l==='a10'?'plan':'preview'}); }
function newLessonIn(p){ S.open[p]=true; openLesson('rel','a10'); }
function approve(){ S.planApproved.a10=true; send('Aprovado. Pode fazer.'); }
function stageClick(e){
  if(!S.pinMode || e.target.closest('.pinbox')) return;
  const r = e.currentTarget.getBoundingClientRect();
  go({draft:{x:Math.round((e.clientX-r.left)/r.width*100), y:Math.round((e.clientY-r.top)/r.height*100)}});
  setTimeout(()=>document.getElementById('pinText')?.focus());
}
function addPin(){
  const t = document.getElementById('pinText')?.value.trim(); if(!t) return;
  const pin = {state:S.state, x:S.draft.x, y:S.draft.y, text:t};
  S.pins.push(pin); S.pending.push(pin); go({draft:null, pinMode:false});
}
let raf;
function play(id){
  cancelAnimationFrame(raf); S.state=id; S.playing=id; S.progress=0; S.draft=null; render();
  const dur = Math.min(TRANS[id],5)*600, t0 = performance.now();
  const step = now => {
    S.progress = Math.min(1,(now-t0)/dur);
    const st = document.querySelector('#stage svg'); if(st) st.outerHTML = diagram(id, S.progress);
    const sc = document.getElementById('scrub'); if(sc) sc.style.width = S.progress*100+'%';
    const fl = document.getElementById('fill'); if(fl) fl.style.width = S.progress*100+'%';
    if(S.progress<1) raf = requestAnimationFrame(step); else { S.playing=null; render(); }
  };
  raf = requestAnimationFrame(step);
}
function send(text){
  const box = document.getElementById('msg');
  text = text || box?.value.trim(); if(!text && !S.pending.length) return;
  if(S.view!=='lesson'){ openLesson(S.project,'a10'); }
  const pinsTxt = S.pending.map(p=>`📍 ${p.state}: ${p.text}`).join('\n');
  S.pending.forEach(p=>p.sent=true); S.pending=[];
  const steps = [['run','Lendo CONTEXTO.md e plano.yaml']], msg = {who:'agent', steps, done:false};
  S.extra.push({who:'me', text:[text,pinsTxt].filter(Boolean).join('\n')}, msg); render(); scrollEnd();
  const script = [['Arquivo alterado: cenas.py'],['Renderizando a prévia','manimflow preview .'],['Conferindo a continuidade','manimflow check-continuity .']];
  let i=0; const tick = setInterval(()=>{
    steps[steps.length-1][0]='ok';
    if(i<script.length) steps.push(['run',...script[i++]]);
    else { clearInterval(tick); msg.done=true; msg.summary='Trabalhou por 9 s · 4 etapas'; msg.text='(Protótipo) Feito. Aqui viria o que mudou e o cartão da prévia.'; S.pins.forEach(p=>{ if(p.sent) p.done=true; }); }
    render(); scrollEnd();
  }, 900);
}
function scrollEnd(){ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }

// ═════════════════════════════════════════════════════════════
//  Render
// ═════════════════════════════════════════════════════════════
function render(){
  document.body.classList.toggle('c', isC());
  const main = S.view==='home' ? (isC()?homeC():homeF()) : S.view==='project' ? (isC()?projectC():projectF()) : lessonScreen();
  const keepScroll = document.getElementById('thread')?.scrollTop;
  document.getElementById('app').innerHTML = (isC()?sidebarC():sidebarF()) + `<main class="main">${main}</main>`;
  if(keepScroll!=null){ const t=document.getElementById('thread'); if(t) t.scrollTop=keepScroll; }
  document.querySelectorAll('.tex').forEach(el=>{ try{ katex.render(el.dataset.tex, el, {throwOnError:false}); }catch(e){ el.textContent = el.dataset.tex; } });
  document.getElementById('switcher').innerHTML = `<span class="tag-proto">PROTÓTIPO</span><button onclick="cycle(-1)">←</button><span><b>${S.variant}</b> · ${VARIANTS[S.variant]}</span><button onclick="cycle(1)">→</button>`;
}
function cycle(d){
  const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant)+d+keys.length)%keys.length];
  const u = new URL(location); u.searchParams.set('variant', S.variant); history.replaceState(null,'',u); render();
}
addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); isC()?openPalette():openSearch(); return; }
  if(e.key==='Escape'){ closeModal(); closeMenu(); if(S.draft||S.pinMode) go({draft:null,pinMode:false}); return; }
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1);
});
// ?screen= jumps straight to a screen
({home:()=>go({view:'home'}), project:()=>go({view:'project'}), plan:()=>openLesson('rel','a10'), rendering:()=>openLesson('rel','a11'),
  code:()=>go({wsTab:'code'}), eq:()=>go({wsTab:'eq'}), closed:()=>go({ws:false}), wide:()=>go({chatW:320}),
  export:()=>openExport(), palette:()=>openPalette(), pin:()=>go({pinMode:true,draft:{x:30,y:55}}), settings:()=>openSettings('uso')}[params.get('screen')]||(()=>{}))();
render();
</script>
