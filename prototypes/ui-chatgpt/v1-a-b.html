<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: what should ManimFlow's UI look like if it feels like
  ChatGPT with Projects? Two variants on one page, switched with ?variant=A|B or the bar at
  the bottom (← → keys work too). Nothing persists; every click is fake.
    A · Conversa + painel  — ChatGPT as is; renders, plan, code and equations open in a side
                             panel, like ChatGPT's canvas / activity panel.
    B · Estúdio            — ChatGPT sidebar and projects, but a lesson opens as a studio:
                             a narrow chat on the left and a big workspace with a state timeline.
  Open the file in a browser. No build, no server.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManimFlow · protótipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
<style>
:root{
  --bg:#ffffff; --side:#f9f9f9; --hover:#ececec; --active:#e3e3e3; --line:#e5e5e5;
  --text:#0d0d0d; --muted:#6b6b6b; --faint:#9b9b9b; --bubble:#f1f1f1; --card:#fff;
  --accent:#0d0d0d; --accent-text:#fff; --blue:#1f6fb2; --green:#2b8a3e; --orange:#d9480f; --red:#c92a2a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;align-items:center;gap:8px} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Sidebar (ChatGPT) ─────────────────────────────────────── */
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px;gap:2px;transition:width .15s}
.side.collapsed{width:56px}
.side.collapsed .lbl,.side.collapsed .sec,.side.collapsed .sub,.side.collapsed .usage{display:none}
.side .top{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;width:100%;text-align:left;white-space:nowrap;overflow:hidden}
.nav:hover{background:var(--hover)} .nav.on{background:var(--active)}
.nav .ic{width:18px;text-align:center;flex:none;opacity:.8}
.sec{font-size:12px;color:var(--faint);padding:14px 10px 4px}
.sub .nav{padding-left:38px;font-size:13.5px}
.sidescroll{flex:1;overflow:auto;margin:0 -8px;padding:0 8px}
.usage{margin:6px 4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.me:hover{background:var(--hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:#d6e4f0;color:#1f4f7a;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

/* ── Main area ─────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid transparent}
.topbar.lined{border-bottom-color:var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:15px;padding:6px 8px;border-radius:8px}
.crumb:hover{background:var(--hover)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{background:var(--hover)}
.content{flex:1;display:flex;min-height:0}

/* ── Composer ──────────────────────────────────────────────── */
.composer{border:1px solid var(--line);border-radius:26px;background:var(--bg);box-shadow:var(--shadow);padding:10px 10px 8px 16px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;min-height:24px;max-height:160px;padding:4px 0}
.composer .tools{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:var(--bg)}
.chip:hover{background:var(--hover)} .chip.on{background:#e8f0f8;border-color:#bcd3e8;color:#174a77}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-size:16px}
.disclaimer{text-align:center;font-size:11.5px;color:var(--faint);padding:6px 0 10px}

/* ── Chat ──────────────────────────────────────────────────── */
.thread{flex:1;overflow:auto}
.thread-inner{max-width:740px;margin:0 auto;padding:24px 24px 40px;display:flex;flex-direction:column;gap:18px}
.msg-user{align-self:flex-end;max-width:80%;background:var(--bubble);padding:10px 16px;border-radius:20px;white-space:pre-wrap}
.msg-agent{display:flex;flex-direction:column;gap:10px}
.msg-agent p{margin:0}
.actions{display:flex;gap:2px;color:var(--muted)} .actions button{padding:4px 6px;border-radius:6px} .actions button:hover{background:var(--hover)}
.activity{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.activity summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.activity summary::-webkit-details-marker{display:none}
.activity summary:hover{background:var(--side)}
.activity ol{list-style:none;margin:0;padding:4px 14px 12px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.activity li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.activity li .cmd{color:var(--faint);font-size:11.5px}
.ok{color:var(--green)} .bad{color:var(--red)} .run{color:var(--blue)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #bcd3e8;border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* plan card (Gemini / Descript) */
.plan{border:1px solid var(--line);border-radius:16px;background:var(--side);padding:14px}
.plan h4{margin:0 0 10px;font-size:14px;font-weight:600}
.plan .st{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.plan .st:first-of-type{border-top:0}
.tag{font:600 11.5px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-align:center}
.trans{font-size:12px;color:var(--muted);padding-left:54px;margin:-2px 0 2px}
.comment{font-size:12px;color:#8a5a00;background:#fff6e0;border-radius:8px;padding:4px 8px;margin-top:4px;display:inline-block}

/* result card */
.result{border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;background:var(--card)}
.result:hover{box-shadow:var(--shadow)}
.result .strip{display:flex;gap:6px;padding:10px;background:var(--side);overflow:hidden}
.result .strip svg{width:120px;flex:none;border-radius:6px;border:1px solid var(--line);background:#fff}
.result .foot{display:flex;align-items:center;gap:10px;padding:10px 14px}

/* ── Panels (preview / plan / code / equations) ────────────── */
.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.tab{padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.tab:hover{background:var(--hover)} .tab.on{background:var(--active);color:var(--text)}
.pbody{flex:1;overflow:auto;min-height:0}
.stage{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%}
.stage svg{width:100%;height:100%;display:block}
.player{display:flex;align-items:center;gap:10px;padding:8px 2px}
.scrub{flex:1;height:4px;border-radius:2px;background:var(--hover);position:relative}
.scrub i{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:2px}
.states{display:flex;gap:6px;flex-wrap:wrap}
.spill{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font:600 12px ui-monospace,monospace}
.spill:hover{background:var(--hover)} .spill.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

/* filmstrip (variant B) */
.film{display:flex;align-items:center;gap:0;overflow-x:auto;padding:12px 16px 14px}
.frame{flex:none;width:150px;border-radius:10px;border:2px solid transparent;padding:3px;cursor:pointer}
.frame:hover{background:var(--side)} .frame.on{border-color:var(--blue)}
.frame svg{width:100%;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.frame .cap{font-size:12px;padding:4px 2px 0;display:flex;gap:6px}
.tpill{flex:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:0 4px;margin-top:-18px;cursor:pointer}
.tpill b{display:block;width:30px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--text);background:var(--bg)}
.tpill:hover b{background:var(--accent);color:var(--accent-text)}
.tpill.on b{background:var(--blue);color:#fff;border-color:var(--blue)}

/* code */
.code{display:flex;height:100%}
.files{width:180px;flex:none;border-right:1px solid var(--line);padding:8px;font-size:13px}
.file{display:flex;gap:8px;padding:5px 8px;border-radius:6px;width:100%;text-align:left}
.file:hover{background:var(--hover)} .file.on{background:var(--active)}
.editor{flex:1;min-width:0;display:flex;flex-direction:column}
.editor pre{margin:0;flex:1;overflow:auto;padding:14px 16px;font-size:12.5px;line-height:1.6;outline:none}
.editor pre code.hljs{background:none;padding:0}
.edbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* equations */
.eqs{display:flex;flex-direction:column}
.eq{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.eq .name{font-size:12px;color:var(--muted);grid-column:1/-1}
.eq .val{font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.eqh{font-size:12px;color:var(--faint);padding:14px 16px 4px;text-transform:uppercase;letter-spacing:.04em}

/* plan editor (B) */
.cards{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:16px}
.pcard{flex:none;width:220px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.pcard svg{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.pcard .t{font-weight:600}
.pcard textarea{border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;resize:none;font-size:13px;color:var(--muted);min-height:96px;background:none}
.pcard textarea:hover,.pcard textarea:focus{border-color:var(--line);outline:0;background:var(--side)}
.parrow{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center}

/* ── Project page / home ───────────────────────────────────── */
.center{flex:1;overflow:auto}
.center-inner{max-width:720px;margin:0 auto;padding:64px 24px 40px}
.ptitle{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:500;margin-bottom:22px}
.picon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.ltabs{display:flex;gap:4px;margin:28px 0 8px}
.lrow{display:flex;gap:14px;padding:12px 10px;border-radius:10px;cursor:pointer;align-items:center;border-bottom:1px solid var(--line)}
.lrow:hover{background:var(--side)}
.lrow svg{width:88px;flex:none;border-radius:6px;border:1px solid var(--line);background:#fff}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#fff6e0;color:#8a5a00;white-space:nowrap}
.badge.ok{background:#e7f5ea;color:#1e6b30}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card)}
.gcard:hover{box-shadow:var(--shadow)}
.gcard svg{width:100%;display:block;border-bottom:1px solid var(--line);background:#fff}
.gcard .b{padding:10px 12px}
.newcard{border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;min-height:180px;color:var(--muted);cursor:pointer}
.newcard:hover{background:var(--side)}
.instr{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.instr h5{margin:0 0 4px;font-size:13.5px}

/* ── Modal ─────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50}
.modal{background:var(--bg);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto}
.modal.wide{width:min(820px,calc(100vw - 32px))}
.mhead{display:flex;align-items:center;padding:16px 20px 8px;font-size:17px;font-weight:600}
.mbody{padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
.field{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:0;background:var(--bg)}
.field:focus{border-color:#999}
.hint{display:flex;gap:10px;background:var(--side);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:12px;color:var(--muted)}
.preset b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.preset.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.setting{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:8px;font-size:12.5px}
.seg button.on{background:var(--active)}
.seg button:disabled{color:var(--faint);cursor:not-allowed}
.settings{display:flex;min-height:440px}
.settings nav{width:180px;border-right:1px solid var(--line);padding:12px 8px}
.settings section{flex:1;padding:16px 22px}
.settings h3{margin:0 0 14px;font-size:17px;font-weight:600}
.menu{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:220px}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px}
.menu button:hover{background:var(--hover)}

/* ── Prototype switcher (not part of the design) ───────────── */
.switcher{position:fixed;bottom:14px;right:14px;z-index:100;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13px;border:2px solid #ff3d7f}
.switcher button{color:#fff;width:30px;height:30px;border-radius:50%} .switcher button:hover{background:#333}
.switcher span{padding:0 10px;white-space:nowrap}
.switcher .tag-proto{background:#ff3d7f;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}

@media (max-width:900px){ .side{display:none} .presets{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal"></div>
<div class="switcher" id="switcher"></div>

<script>
// ═════════════════════════════════════════════════════════════
//  Fake data — the bundled relativity example, plus made-up lessons
// ═════════════════════════════════════════════════════════════
const ORDER = ['S0','S1','S2','S2b','S2c','S3','S5','S3v','R'];
const STATES = {
  S0:{t:'Diagrama da Terra', v:'Eixos da Terra, a linha da Terra em x = 8 e o herói na origem.'},
  S1:{t:'Eixos do herói', v:'Os eixos oblíquos do herói, já em v = 0,6, sobre os eixos da Terra.'},
  S2:{t:'Reflexão', v:'A Emissão em (0, 0), o herói e a luz até a Reflexão, (8, 8) em azul.'},
  S2b:{t:'Instante da Reflexão', v:'Em verde, o tracejado t_T = 8 até o herói, o relógio dele (6,4) e (4,8, 8).'},
  S2c:{t:'Coordenadas do herói', v:'Sem o verde. Tracejados laranja até os eixos do herói e (4, 4).'},
  S3:{t:'Colisão', v:'O raio refletido e o herói até a Colisão, (6, 10) em azul e (0, 8) em laranja.', c:'O rótulo "Colisão" está perto da borda de cima do quadro.'},
  S5:{t:'Simultaneidade', v:'A linha verde de simultaneidade do herói, de t_H = 0 até a Terra.'},
  S3v:{t:'De volta à Colisão', v:'A mesma imagem do S3, para o boost começar dela.'},
  R:{t:'Referencial do herói', v:'O diagrama no referencial do herói, eixos dele ortogonais.', c:'Confirmar com o grupo que os eixos oblíquos vêm antes deste diagrama.'},
};
const TRANS = {S1:4,S2:4.7,S2b:3.5,S2c:1.9,S3:2.6,S5:4,R:4.7};   // keyed by the state they lead to
const TRANS_DESC = {
  S1:'Os eixos do herói aparecem e se fecham de v = 0 até 0,6.',
  S2:'A Emissão entra com um flash; herói e luz crescem até a Reflexão.',
  S2b:'O verde entra em ordem: tracejado, 6,4, vertical, (4,8, 8).',
  S2c:'O verde some; entram as projeções laranja e (4, 4).',
  S3:'Raio refletido e herói até a Colisão.',
  S5:'A linha "8 min-luz" gira até t_H = 0.',
  R:'Boost de Lorentz contínuo até o referencial do herói.',
};
const PREV = {S1:'S0',S2:'S1',S2b:'S2',S2c:'S2b',S3:'S2c',S5:'S3',R:'S3v'};

const PROJECTS = [
  {id:'rel', name:'Relatividade Restrita', sub:'Insper · 6º semestre', icon:'⚛︎', bg:'#e8f0f8', fg:'#1f6fb2',
   instr:'Notação das aulas: c = 1, S = Terra (x_T, t_T), S\' = herói (x_H, t_H). Vírgula decimal. Nada de equações dentro do diagrama: elas ficam no slide.',
   lessons:[
    {id:'a09', name:'Aula 09 · Diagrama de Minkowski', when:'ontem', status:'ok', statusTxt:'9 estados renderizados', thumb:'S3', snippet:'Mostre os eixos do herói se fechando mais devagar, uns 6 segundos'},
    {id:'a10', name:'Aula 10 · Paradoxo dos gêmeos', when:'3 dias', status:'wait', statusTxt:'Plano aguardando você', thumb:'S5', snippet:'Plano com 4 estados: partida, ida, volta, reencontro'},
    {id:'a11', name:'Aula 11 · Contração do comprimento', when:'1 semana', status:'ok', statusTxt:'5 estados', thumb:'R', snippet:'A régua do herói no referencial da Terra'},
  ]},
  {id:'mec', name:'Física 1 · Mecânica', sub:'1º semestre', icon:'↗︎', bg:'#e7f5ea', fg:'#2b8a3e',
   instr:'Gravidade 9,8 m/s². Vetores com seta cheia. Mostrar sempre a escala.',
   lessons:[
    {id:'m01', name:'Lançamento oblíquo', when:'2 semanas', status:'ok', statusTxt:'3 estados', thumb:'S2', snippet:'Decomponha a velocidade em vx e vy'},

// ═════════════════════════════════════════════════════════════
//  Fake Manim render: a Minkowski diagram drawn in SVG
// ═════════════════════════════════════════════════════════════
const C = {ink:'#1a1a1a', blue:'#1f6fb2', orange:'#d9480f', dorange:'#9a3412', gold:'#b8860b', green:'#2b8a3e', grid:'#e8e8e8'};
function diagram(id, p=1, opts={}){
  const idx = id==='S3v' ? ORDER.indexOf('S3') : ORDER.indexOf(id);
  const at = s => idx >= ORDER.indexOf(s);
  const only = s => id===s;
  const boost = id==='R' ? 0.6*ease(p) : 0;
  const g = 1/Math.sqrt(1-boost*boost);
  const T = (x,t) => boost ? [g*(x-boost*t), g*(t-boost*x)] : [x,t];
  const X = x => 230 + x*30, Y = t => 335 - t*28;
  const P = (x,t) => { const [a,b]=T(x,t); return [X(a),Y(b)]; };
  const fresh = s => id===s && !opts.still ? ease(p) : 1;      // reveal factor for the state just entered
  let o = '';
  const line = (x1,t1,x2,t2,col,w=2,f=1,dash='') => { const [a,b]=P(x1,t1), [c,d]=P(x1+(x2-x1)*f, t1+(t2-t1)*f);
    o += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round"/>`; };
  const dot = (x,t,col,r=5,f=1) => { if(f<.05) return; const [a,b]=P(x,t); o += `<circle cx="${a}" cy="${b}" r="${r*f}" fill="${col}"/>`; };
  const txt = (x,t,s,col,dx=8,dy=-8,f=1,size=15) => { if(f<.3) return; const [a,b]=P(x,t); o += `<text x="${a+dx}" y="${b+dy}" fill="${col}" font-size="${size}" font-family="Georgia,serif" opacity="${f}">${s}</text>`; };
  // grid
  for(let i=-8;i<=16;i++){ o+=`<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="360" stroke="${C.grid}" stroke-width="1"/>`; }
  for(let i=-2;i<=14;i++){ o+=`<line x1="0" y1="${Y(i)}" x2="640" y2="${Y(i)}" stroke="${C.grid}" stroke-width="1"/>`; }
  // Earth axes + Earth worldline + hero
  line(-1,0,11,0,C.blue,2); line(0,-1,0,11.5,C.blue,2);
  txt(11,0,'x<tspan font-size="11">T</tspan>',C.blue,4,18); txt(0,11.5,'ct<tspan font-size="11">T</tspan>',C.blue,-34,10);
  line(8,-1,8,11.5,C.blue,3); txt(8,11,'Terra',C.blue,8,10,1,13);
  // hero axes
  if(at('S1')){ const v = id==='S1' && !opts.still ? 0.6*ease(p) : 0.6;
    line(0,0,11*v,11,C.orange,2); line(0,0,11,11*v,C.orange,2);
    txt(11*v,11,'ct<tspan font-size="11">H</tspan>',C.orange,6,6); txt(11,11*v,'x<tspan font-size="11">H</tspan>',C.orange,4,18); }
  // reflection
  if(at('S2')){ const f = fresh('S2');
    line(0,0,8,8,C.gold,4,f); line(0,0,4.8,8,C.dorange,3,f);
    dot(0,0,C.ink,5); dot(8,8,C.ink,5,f>.98?1:0); txt(8,8,'(8, 8)',C.blue,10,4,f>.98?1:0); }
  if(only('S2b')){ const f = fresh('S2b');
    line(8,8,4.8,8,C.green,2.5,f,'6 5'); line(4.8,8,4.8,0,C.green,2.5,f,'6 5'); dot(4.8,8,C.green,5,f);
    txt(4.8,8,'6,4',C.green,-30,-8,f); txt(4.8,0,'4,8',C.green,-12,20,f); }
  if(at('S2c') && id!=='R'){ const f = fresh('S2c');
    line(8,8,3,5,C.orange,2,f,'6 5'); line(8,8,5,3,C.orange,2,f,'6 5'); txt(8,8,'(4, 4)',C.orange,10,24,f); }
  if(at('S3')){ const f = id==='S3' ? fresh('S3') : 1;
    line(8,8,6,10,C.gold,4,f); line(4.8,8,6,10,C.dorange,3,f); dot(6,10,C.ink,5,f>.98?1:0);
    txt(6,10,'Colisão',C.ink,-70,-8,f>.98?1:0,14); if(!boost) txt(6,10,'(6, 10)',C.blue,10,4,f>.98?1:0); }
  if(only('S5')){ const f = fresh('S5'); line(0,0,8,4.8,C.green,3,f); txt(8,4.8,'t<tspan font-size="11">T</tspan> = 4,8',C.green,8,4,f); }
  if(id==='R' && p>.9){ txt(0,8,'(0, 8)',C.orange,10,4); txt(4,4,'(4, 4)',C.green,10,4); }
  return `<svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#fff"/>${o}</svg>`;
}
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function openSearch(){
  const all = PROJECTS.flatMap(p=>p.lessons.map(l=>({...l,p})));
  modal(`<div class="mbody" style="padding-top:16px"><input class="field" placeholder="Buscar aulas e conversas…" autofocus>
    ${all.map(l=>`<button class="nav" onclick="closeModal();openLesson('${l.p.id}','${l.id}')"><span class="ic" style="color:${l.p.fg}">${l.p.icon}</span><span class="grow ellipsis">${l.name}</span><span class="faint small">${l.when}</span></button>`).join('')}</div>`);
}
function openThreads(){
  modal(`<div class="mhead">Conversas desta aula${X_}</div><div class="mbody">
    <div class="muted small">Cada vez que você abre a aula começa uma conversa nova. A memória da aula fica no CONTEXTO.md, então o agente não esquece o que já foi decidido.</div>
    ${[['Hoje','Eixos do herói mais devagar'],['12/11','Plano e primeira prévia'],['10/11','Ideias iniciais']].map(([d,t],i)=>`<button class="nav ${i===0?'on':''}"><span class="grow">${t}</span><span class="faint small">${d}</span></button>`).join('')}</div>`);
}
function openVersions(){
  modal(`<div class="mhead">Versões${X_}</div><div class="mbody">
    ${[['agora','Eixos do herói mais devagar','agente'],['há 1 h','Edição manual em cenas.py','você'],['ontem','Rótulo da Colisão mais baixo','agente'],['12/11','Primeira prévia','agente']].map(([d,t,w])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${t}</b><div class="faint small">${d} · ${w}</div></div><button class="btn sm">Ver</button><button class="btn sm">Voltar para esta</button></div>`).join('')}</div>`);
}
function openPlan(){ if(S.variant==='A') go({panel:true,panelTab:'plan'}); else go({wsTab:'plan'}); }
function lessonMenu(e){
  closeMenu(); const r = e.currentTarget.getBoundingClientRect();
  const m = document.createElement('div'); m.className='menu'; m.id='menu';
  m.style.left = Math.min(r.left, innerWidth-240)+'px'; m.style.top = (r.bottom+6)+'px';
  m.innerHTML = `<button onclick="closeMenu();openThreads()">🕘 Conversas anteriores</button><button onclick="closeMenu();openVersions()">↺ Versões</button><button>📁 Abrir pasta da aula</button><button>✎ Renomear</button><button>⇄ Mover para outra turma</button><button style="color:var(--red)">🗑 Apagar</button>`;
  document.body.appendChild(m); setTimeout(()=>addEventListener('click',closeMenu,{once:true}));
}
function closeMenu(){ document.getElementById('menu')?.remove(); }

// ═════════════════════════════════════════════════════════════
//  Fake behaviour
// ═════════════════════════════════════════════════════════════
function openLesson(p,l){ go({view:'lesson',project:p,lesson:l,extra:[],state:'S3',playing:null, panel: l!=='a10', panelTab: l==='a10'?'plan':'preview', wsTab: l==='a10'?'plan':'preview'}); }
function newLessonB(){ openLesson('rel','a10'); }
function approve(){ S.planApproved.a10=true; send('Aprovado. Pode fazer.'); }
let raf;
function play(id){
  cancelAnimationFrame(raf); S.state=id; S.playing=id; S.progress=0; render();
  const dur = Math.min(TRANS[id],5)*1000*0.6, t0 = performance.now();
  const step = now => {
    S.progress = Math.min(1,(now-t0)/dur);
    const st = document.getElementById('stage'); if(st) st.innerHTML = diagram(id, S.progress);
    const sc = document.getElementById('scrub'); if(sc) sc.style.width = S.progress*100+'%';
    if(S.progress<1) raf = requestAnimationFrame(step); else { S.playing=null; render(); }
  };
  raf = requestAnimationFrame(step);
}
function send(text){
  const box = document.getElementById('msg');
  text = text || box?.value.trim(); if(!text) return;
  if(S.view!=='lesson'){ openLesson(S.project,'a10'); S.extra=[]; }
  const steps = [['run','Lendo CONTEXTO.md e plano.yaml']];
  const msg = {who:'agent', steps, done:false};
  S.extra.push({who:'me',text}, msg); render(); scrollEnd();
  const script = [['Arquivo alterado: cenas.py'],['Renderizando a prévia','manimflow preview .'],['Conferindo a continuidade','manimflow check-continuity .']];
  let i=0; const tick = setInterval(()=>{
    steps[steps.length-1][0]='ok';
    if(i<script.length){ steps.push(['run',...script[i++]]); }
    else { clearInterval(tick); msg.done=true; msg.summary='Trabalhou por 9 s · 4 etapas'; msg.text='(Protótipo) Feito. Num app real, aqui vem o que o agente mudou e um cartão da prévia.'; }
    render(); scrollEnd();
  }, 900);
}
function scrollEnd(){ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }

// ═════════════════════════════════════════════════════════════
//  Render
// ═════════════════════════════════════════════════════════════
function render(){
  const main = S.view==='home' ? (S.variant==='A'?homeA():homeB()) : S.view==='project' ? projectPage() : (S.variant==='A'?lessonA():lessonB());
  document.getElementById('app').innerHTML = sidebar() + `<main class="main">${main}</main>`;
  document.querySelectorAll('.tex').forEach(el=>{ try{ katex.render(el.dataset.tex, el, {throwOnError:false}); }catch(e){ el.textContent = el.dataset.tex; } });
  document.getElementById('switcher').innerHTML = `<span class="tag-proto">PROTÓTIPO</span><button onclick="cycle(-1)">←</button><span><b>${S.variant}</b> · ${VARIANTS[S.variant]}</span><button onclick="cycle(1)">→</button>`;
}
function cycle(d){
  const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant)+d+keys.length)%keys.length];
  const u = new URL(location); u.searchParams.set('variant', S.variant); history.replaceState(null,'',u); render();
}
addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1); if(e.key==='Escape'){ closeModal(); closeMenu(); }
});
// ?screen= jumps straight to a screen, for sharing a link to one
({home:()=>go({view:'home'}), project:()=>go({view:'project'}), plan:()=>openLesson('rel','a10'),
  code:()=>go({panelTab:'code',wsTab:'code'}), eq:()=>go({panelTab:'eq',wsTab:'eq'}), board:()=>go({panelTab:'plan',wsTab:'plan'}),
  export:()=>openExport(), settings:()=>openSettings('uso'), closed:()=>go({panel:false})}[params.get('screen')]||(()=>{}))();
render();
</script>
